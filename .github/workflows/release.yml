name: Release

# Pushing a tag `vX.Y.Z` publishes that commit to PyPI. Trusted publishing, so no token is stored
# anywhere: PyPI trusts this workflow file, in this repository, running in the `pypi` environment, and
# nothing else. Configure that once under the project's Publishing settings on pypi.org (a "pending
# publisher" before the first release creates the project).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # A tag naming a different version than pyproject.toml would publish the file's version under
      # the tag's name, and PyPI never lets a version be uploaded twice, so a mismatch has to stop here.
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Its own job so the OIDC permission reaches only the step that uploads, never the build.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kokua
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
