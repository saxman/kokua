[project]
name = "kokua"
version = "0.1.0"
description = "Kokua (Hawaiian: help, assistance): a hackable, modular personal-assistant application built on AIMU."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Paul Saxman" }]
keywords = ["ai", "assistant", "agent", "llm", "aimu", "personal-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 0.28.0 is the oldest AIMU carrying everything Kokua needs. Three releases contribute to it. 0.26.0 is
# why the floor first moved: its tool loop no longer strands an un-dispatched tool call before the forced
# wrap-up prompt, and without that fix every Anthropic run reaching its round cap mid-tool-call died on
# a 400 naming the unanswered `tool_use` ids rather than answering -- which made search-heavy sub-agents
# fail routinely, since they are the runs that spend every round calling tools. 0.27.0 then adds
# `ModelRefusalError`, which `core/turns.py` catches at three sites so a request the model's classifiers
# decline reads as declined instead of as a generic failure, and makes every provider report how a turn
# ended so `TruncatedTurnError` fires outside Ollama for the first time. 0.28.0 adds a `"max_iterations"`
# entry to `SUBAGENT_SPEC_KEYS`, the spec key `core/agents.py` writes for an agent declaring its own
# tool-loop cap; that set has been closed since 0.17.0 and is checked when a spawn tool is built, so an
# older AIMU raises `ValueError` at startup either way and the preflight buys the wording of that failure,
# not its timing. 0.28.0 carries a second capability Kokua needs, and it is the one the probe grips:
# `StreamingContentType.CONTINUING`, the phase a driver yields to mark the boundary before a round the
# loop itself injected (a nudge, a wrap-up). Without it `channels/web.py` and `core/subagents.py` never
# see the boundary, so neither reports it and nothing raises anywhere, which is the silent case the
# spec key above does not have. Every earlier release in the floor's history is listed in
# `kokua.aimu_compat`, which is also what enforces this floor for a sibling
# checkout, and `tests/test_aimu_compat.py` pins this specifier against that one so the two halves
# cannot drift. This pin is what ships in the wheel and what a PyPI install resolves;
# [tool.uv.sources] below separately redirects development installs to the sibling checkout.
dependencies = [
    "aimu[anthropic,ollama,openai_compat,memory]>=0.28.0",
    # Comment-preserving TOML writes for config.toml. stdlib `tomllib` reads TOML but cannot write it;
    # tomlkit round-trips the parsed document so app writes keep the user's comments and formatting.
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# The web front end (Starlette + uvicorn WebSocket server).
web = [
    "starlette",
    "uvicorn>=0.30",
]
dev = [
    # Pinned to a minor range, because an unpinned linter makes CI's verdict drift from the one you
    # get locally: `uv run` resolves ruff through uv.lock, while CI installs with pip and no lock, so
    # it picked up 0.16, whose default rule set is far wider (UP, I, RUF, DTZ, B, TRY...) and which
    # reported 312 findings on a tree that lints clean here. Adopting that set is a deliberate change,
    # not something a fresh CI run should decide (see TODO.md). Matches AIMU's own pin.
    "ruff>=0.15,<0.16",
    "pytest",
    "pytest-asyncio",
    # Browser-driven end-to-end tests of the web UI's client JS (opt-in: `pytest -m e2e`).
    # Needs a Chromium: `uv run playwright install chromium`.
    "pytest-playwright",
]
# The documentation site (mkdocs-material, published to https://saxman.info/kokua/ by
# .github/workflows/docs.yml). mkdocstrings is here for the API reference page, which arrives with the
# rest of the Reference section; the plugin stays out of mkdocs.yml until there is a page using it.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/saxman/kokua"
Repository = "https://github.com/saxman/kokua"
Changelog = "https://github.com/saxman/kokua/blob/main/CHANGELOG.md"

# `kokua` runs the selected front end (default: cli). `kokua-web` is a convenience for
# `kokua --frontend web`; both go through `cli` so they share the AIMU preflight (see
# `aimu_compat`), which has to run before anything imports the web front end.
[project.scripts]
kokua = "kokua.cli:main"
kokua-web = "kokua.cli:main_web"

# Built-in plugins, registered like any third-party module would be. Install a package
# that adds an entry point under these groups and Kokua discovers it at runtime.
[project.entry-points."kokua.frontends"]
cli = "kokua.frontends.cli:FRONTEND"
web = "kokua.frontends.web:FRONTEND"

# Every toolset Kokua ships, registered exactly the way a third party's package would register
# one. This table is the index: there is no directory scan and no hand-maintained list in code, so
# `tests/toolsets/test_registration.py` pins it against src/kokua/toolsets/ in both directions --
# a module here with no entry, or an entry naming no module, fails the suite rather than producing a
# toolset that silently does not exist. Each key must equal its module name and its TOOLSET.name.
[project.entry-points."kokua.toolsets"]
aimu_agents = "kokua.toolsets.aimu_agents:TOOLSET"
audio = "kokua.toolsets.audio:TOOLSET"
benchmark = "kokua.toolsets.benchmark:TOOLSET"
capabilities = "kokua.toolsets.capabilities:TOOLSET"
compute = "kokua.toolsets.compute:TOOLSET"
config = "kokua.toolsets.config:TOOLSET"
conversations = "kokua.toolsets.conversations:TOOLSET"
documents = "kokua.toolsets.documents:TOOLSET"
fs = "kokua.toolsets.fs:TOOLSET"
github_backup = "kokua.toolsets.github_backup:TOOLSET"
image = "kokua.toolsets.image:TOOLSET"
mcp = "kokua.toolsets.mcp:TOOLSET"
memory = "kokua.toolsets.memory:TOOLSET"
misc = "kokua.toolsets.misc:TOOLSET"
planning = "kokua.toolsets.planning:TOOLSET"
scheduling = "kokua.toolsets.scheduling:TOOLSET"
skills = "kokua.toolsets.skills:TOOLSET"
speech = "kokua.toolsets.speech:TOOLSET"
time = "kokua.toolsets.time:TOOLSET"
transcription = "kokua.toolsets.transcription:TOOLSET"
web = "kokua.toolsets.web:TOOLSET"

# Kokua and AIMU are developed together, so a `uv sync` here installs the sibling checkout
# editable: architectural changes can move code across the boundary and be exercised
# immediately, without a release round-trip.
#
# Note what this does NOT do: uv installs a path source without checking it against the
# version specifier above (verified -- a declared `aimu>=0.99.0` installs a 0.13.1 sibling and
# locks it without complaint). So the floor governs a `pip install kokua` and nothing else, and
# an out-of-date sibling is caught at startup by `kokua.aimu_compat` instead.
#
# The path is relative to this file, so `../aimu` must exist. Without it (CI, a fresh clone,
# or anyone who just wants to run Kokua), ignore this table: `uv sync --no-sources` resolves
# AIMU from PyPI instead. Nothing here needs editing.
[tool.uv.sources]
aimu = { path = "../aimu", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kokua*"]

[tool.setuptools.package-data]
kokua = [
    "web_static/*.html",
    "web_static/*.js",
    "web_static/*.css",
    "web_static/fonts/*.woff2",
    "config.example.toml",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# The default suite is mock-only and fast. Browser-driven UI tests are opt-in (they need a running
# server + Chromium), so deselect them unless explicitly requested with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser-driven end-to-end test of the web UI (opt-in; needs the web extra + Chromium)",
]
