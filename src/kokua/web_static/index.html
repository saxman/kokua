<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kokua</title>
  <!-- Resolve the theme before first paint to avoid a flash. Stored choice is "auto" (follow the OS,
       the default), "light", or "dark"; a missing value is treated as "auto". -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var useOS = !stored || stored === "auto";
        var dark = useOS ? (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) : stored === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <!-- Resolve the left panel's stored width/collapsed state before first paint, like the theme above,
       so the sidebar doesn't flash at its default width then jump. Width is clamped to [180, 480]. -->
  <script>
    (function () {
      try {
        var w = parseInt(localStorage.getItem("sidebar-width"), 10);
        if (w >= 180 && w <= 480) document.documentElement.style.setProperty("--sidebar-width", w + "px");
        if (localStorage.getItem("sidebar-collapsed") === "true")
          document.documentElement.setAttribute("data-sidebar-collapsed", "true");
      } catch (e) {}
    })();
  </script>
  <!-- Vendored KaTeX styles (math typesetting; fonts served from /fonts/). Loaded before the page's
       own styles so those win on any conflict. -->
  <link rel="stylesheet" href="katex.min.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-top">
        <span id="wordmark">Kokua</span>
        <button id="new-conv" type="button" title="New conversation">
          <span class="icon">+</span><span class="label">New conversation</span>
        </button>
        <button id="sidebar-toggle" type="button" aria-expanded="true" title="Collapse sidebar">«</button>
      </div>
      <ul id="conv-list"></ul>
      <!-- Scheduled tasks, with each task's own conversations nested under it. Hidden entirely while
           there are no tasks, so it costs nothing for a user who never schedules one. -->
      <section id="tasks" class="hidden">
        <div id="tasks-head">
          <button id="tasks-toggle" type="button" aria-expanded="true" aria-controls="task-list">
            <span class="caret" aria-hidden="true">▾</span><span class="tasks-label">Tasks</span>
            <span id="tasks-count"></span>
          </button>
          <button id="tasks-refresh" type="button" title="Refresh tasks">⟳</button>
        </div>
        <ul id="task-list"></ul>
      </section>
    </aside>
    <div id="sidebar-resize" role="separator" aria-orientation="vertical"
         aria-label="Resize sidebar" tabindex="0"></div>
    <main id="main">
      <header>
        <span id="conv-heading">Kokua</span>
        <span class="header-actions">
          <!-- Glyph, title, and aria-label are set by app.js from the stored choice; the markup
               starts on the "auto" default the pre-paint script above assumes. -->
          <button id="theme-btn" type="button" title="Theme: auto (system)"
                  aria-label="Theme: auto (system)">◐</button>
        </span>
      </header>
      <div id="notifications"></div>
      <div id="log"></div>
      <div id="attach-previews" class="attach-previews hidden"></div>
      <!-- #send and #stop keep separate ids and separate handlers, with only one in the DOM at a time
           (setProcessing toggles .hidden). `disabled` stays the connection state that ws.onopen and
           ws.onclose manage; `.hidden` is the turn state. Two concerns, two attributes, so neither
           button has to work out which thing it currently is. -->
      <form id="form">
        <input id="image-input" type="file" accept="image/*" multiple hidden />
        <textarea id="msg" rows="1" autocomplete="off"
                  placeholder="Message your assistant..." autofocus></textarea>
        <div id="composer-actions">
          <button id="attach-btn" type="button" title="Attach image">📎</button>
          <button id="plan-toggle" type="button" title="Plan this request before acting"
                  aria-pressed="false">Plan</button>
          <!-- Reasoning effort for the messages that follow. Sticky like the Plan toggle: it holds until
               changed, and resets to the configured default on reload, since nothing about it persists.
               "default" sends no request at all, which is what leaves config.toml in force. -->
          <select id="thinking-level" aria-label="Reasoning effort" autocomplete="off"
                  title="Reasoning effort for the messages you send">
            <option value="default">Think: default</option>
            <option value="off">Think: off</option>
            <option value="low">Think: low</option>
            <option value="medium">Think: medium</option>
            <option value="high">Think: high</option>
          </select>
          <span class="spacer"></span>
          <button id="send" type="submit">Send</button>
          <button id="stop" type="button" class="hidden">Stop</button>
        </div>
      </form>
    </main>
  </div>

  <!-- Vendored markdown renderer + sanitizer + math typesetter (offline; see the pinned versions in
       each file's own header). katex.min.js must load before auto-render.min.js (which reads
       window.katex), and all four must load before app.js, which calls into them at top level. -->
  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="katex.min.js"></script>
  <script src="auto-render.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
