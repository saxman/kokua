# Kokua configuration. Run `kokua config init` to write this to $KOKUA_HOME/config.toml (default
# ~/.kokua/config.toml), copy it there yourself, or point at it with --config PATH or $KOKUA_CONFIG.
# Every key is optional; the value shown is the built-in default. Command-line flags override anything
# set here. An unknown key or wrong-typed value is a hard error (startup fails and names the key).
#
# This file is the single source of settings: besides hand-editing, the web settings panel, the
# add_mcp_server tool, and the assistant's own update_config tool write to it too (comments are
# preserved). A few security-critical keys ([security].confirm_tools, [email].to, [paths].data_dir)
# can only be changed by hand-editing, never by the assistant.

[assistant]
# Model string, e.g. "ollama:qwen3:8b". Unset -> $AIMU_LANGUAGE_MODEL, else the first already-running
# local model found (a running Ollama server, then a local OpenAI-compatible server). A cloud model is
# never auto-selected. Startup fails with an actionable message if nothing can be resolved.
#
# For a remote/custom OpenAI-compatible server (llama.cpp llama-server, vLLM, LM Studio, SGLang,
# HF-Serve), append "@<base_url>" to override the endpoint, and for a model id not built into AIMU add
# ";<flags>" (comma-separated from tools,thinking,vision,audio,structured) to declare its capabilities:
#   model = "llamaserver:qwen3-8b.gguf@http://gpu-box:8080/v1"
#   model = "openai-compat:my-model@http://gpu-box:9000/v1;tools,thinking"
# model = "ollama:qwen3:8b"

# system_message = "You are a personal assistant running on the user's own machine. ..."

# Persistent memory across conversations (facts + user documents).
memory = true

# Discover tool-pack plugins via the "kokua.tools" entry-point group.
load_plugins = true

# Let the assistant delegate independent subtasks to fresh, isolated sub-agents (spawn_subagent tool).
# A sub-agent's gated-tool calls (the confirm_tools, e.g. execute_python) are routed to the parent
# for approval and are not run unattended.
subagents = true

# Lean supervisor mode (requires subagents). When true, the assistant keeps only its cross-cutting
# tools (memory, skills, MCP management, config, scheduling, date/time) plus the single spawn_subagent
# delegate, and hands ALL specialized work (web, files, code, domain/MCP tools) to workers whose roles
# carry the scoped toolsets (see [subagents.roles.*] below). This shrinks the per-request tool context.
# Important: in this mode [tools].groups below defines the universe of built-in groups WORKERS may use
# (not the assistant's own tools), so don't set it to ["none"] or your workers have nothing to draw on.
# On by default; set to false for the flat agent that carries every tool itself.
# lean_supervisor = true

# Max per-conversation agents kept live in memory (AgentRegistry LRU cap). Evicted agents rebuild
# from persisted state on next access, so the cap bounds memory, not correctness.
agent_cache_cap = 8

[display]
# Stream the model's reasoning / tool calls into the channel. The web settings panel toggles these
# at runtime; a change there is written straight back into these keys.
show_thinking = true
show_tools = true

[tools]
# AIMU built-in tool groups to expose. Also accepts ["all"] or ["none"]. The generative groups
# (image, audio, speech, transcription) each require their AIMU_*_MODEL env var: there is no default,
# so the tool raises if it is unset rather than downloading weights you did not ask for. Values and
# accepted formats: https://saxman.info/aimu/reference/env-vars/
# "time" (the clock + timezone conversion) is also added to every sub-agent role, whatever that role's
# own `groups` say, since a worker that cannot tell the time is broken regardless of its domain. Drop
# "time" here and no agent gets it, including the workers.
groups = ["web", "fs", "compute", "time", "misc"]

# Images: the assistant reads images you attach (web upload / paste, or the CLI `/attach <path>`
# command); a vision-capable model is needed (Claude models qualify). It can also generate images when
# the AIMU_IMAGE_MODEL env var is set (e.g. "gemini:nano-banana" or a HuggingFace diffusers "hf:<repo>");
# without it, no image-generation tool is offered. Uploaded and generated images are stored under
# data/images and served by the web UI at /images; sessions keep only a small reference, not inline data.

[subagents]
# Run independent tool calls in one turn concurrently, so several spawn_subagent calls overlap.
concurrent = true

# Sub-agent roles the model can pick via spawn_subagent(agent_type, task). These merge over the
# built-in defaults (researcher, coder, generalist) by name: reuse a name to override it, or add a
# new name. A role's worker toolset is the union of: its `groups` (intersected with [tools] groups
# above, so a role narrows within the enabled tools but never exceeds them); the tools of any MCP
# servers it lists in `mcp_servers` (by the server's `name` below, or its raw URL); and the tools of
# any tool-packs it lists in `tool_packs` (installed kokua.tools plugins, e.g. "pdf", "email").
# `system_message` is optional. Roles matter most with lean_supervisor = true, where the assistant
# only delegates and the workers carry the tools. No role needs to list "time": it is added to every
# role from [tools].groups above.
# [subagents.roles.researcher]
# description = "Research specialist: gather and verify information from the web."
# groups = ["web", "misc"]
# [subagents.roles.stock-trader]
# description = "Looks up quotes and places trades."
# mcp_servers = ["stocks"]        # matches [[mcp.server]].name below
# groups = ["compute"]
# [subagents.roles.report-writer]
# description = "Builds and emails PDF reports."
# tool_packs = ["pdf", "email"]

# Remote MCP servers to connect at startup. Each server is its own [[mcp.server]] table.
# `url` is required. `token_env` (optional) names an environment variable holding a bearer token,
# read at startup so the secret stays out of this file; omit it for an unauthenticated server (or
# one that uses the OAuth flow, which triggers automatically on an auth challenge). `name` (optional)
# is a friendly label a sub-agent role can reference in its `mcp_servers` list instead of the full URL.
# Servers you add at runtime with the add_mcp_server tool are appended here automatically (URL only).
# [[mcp.server]]
# url = "https://api.githubcopilot.com/mcp/"
# token_env = "GITHUB_MCP_TOKEN"
#
# [[mcp.server]]
# url = "https://broker.example.com/mcp"
# name = "stocks"

[security]
# Tools that require interactive confirmation before each call (terminal y/N, or Allow/Deny in the
# web UI). These run with full machine access. Set to [] to disable approval. Proactive (unprompted)
# turns auto-deny these regardless. `update_config` is here because it lets the assistant rewrite this
# file (except the security-critical keys, which it can never change).
confirm_tools = ["add_skill_script", "add_mcp_server", "execute_python", "update_config"]

[paths]
# Absolute override for where all transient + user content lives. Default: $KOKUA_HOME/data.
# data_dir = "/path/to/kokua-data"

[frontend]
# Which front end `kokua` runs: "cli", "web", or any installed plugin.
name = "cli"

[web]
# Bind address for the web front end (ignored by other front ends).
host = "127.0.0.1"
port = 8000

[logging]
# Level for the rotating diagnostic log at $KOKUA_HOME/data/logs/kokua.log (5 files x 2 MB). Records
# turn lifecycle (submitted / lock acquired / done / error) so a hung turn is visible after the fact.
# The `/diag` chat command reports live turn + lock state and dumps a wedged turn's async stack;
# `kill -USR1 <pid>` dumps all thread stacks. One of DEBUG, INFO, WARNING, ERROR.
level = "INFO"

[email]
# Let the assistant email information to you (digests, summaries, reports) via SMTP. The assistant can
# ONLY email `to` below; the send_email tool takes no recipient, so it can never mail arbitrary people.
# Sending is UNGATED (no per-send confirmation) so scheduled/proactive turns can send. The email tool is
# offered only when `host` and `to` are set AND the KOKUA_EMAIL_PASSWORD environment variable is present.
#
# The password is read from KOKUA_EMAIL_PASSWORD, NEVER from this file (adding it here is a config error).
# For Gmail / Google Workspace, use an App Password. Leave everything unset to disable email.
# host = "smtp.gmail.com"
# port = 587                    # 587 with STARTTLS (default), or 465 with use_ssl = true
# username = "you@example.com"  # SMTP login user; defaults to `from`, then `to`
# from = "you@example.com"      # From: header; defaults to `to`
# to = "you@example.com"        # the ONLY address the assistant can send to
# use_ssl = false               # false -> STARTTLS on connect; true -> implicit TLS (SMTP_SSL)

[planning]
# Deep planning is invoked per request -- the web UI's Plan toggle, or a "/plan <task>" message -- and
# drafts an explicit plan (which tools/skills/MCP services to use or build) before doing the work.
# plan_review pauses that planned turn for your Approve/Edit/Reject; off runs the plan autonomously.
# plan_review is toggleable at runtime in the web settings panel.
# plan_review = false
# Adversarial review (both off by default). plan_review_agent: an independent, context-free agent critiques
# the plan and Kokua re-plans on rejection. result_review: an independent agent checks the final answer
# before it is shown -- this runs the answer non-streamed -- and Kokua revises on rejection. review_rounds
# bounds each replan/revise loop.
# plan_review_agent = false
# result_review = false
# review_rounds = 2
# Verbose trace: stream every LLM call in a planned turn (planner, each reviewer's prose reasoning +
# verdict, executor, every revision) under labeled phase headers, showing each intermediate version.
# Overrides result_review's "hide until vetted" gate. Off by default.
# show_reasoning = false

[generation]
# Model generation kwargs, layered over the provider's built-in defaults. The web settings panel and
# the update_config tool change these at runtime by writing back here, so this section is the single
# effective layer. Provider support varies: AIMU forces temperature and drops top_p/top_k for thinking
# models, and Anthropic does not support presence_penalty / repetition_penalty (OpenAI-family keys).
# Unset keys fall back to the provider's built-in default.
# temperature = 0.1
# max_tokens = 1024
# top_p = 1.0
# top_k = 40
# presence_penalty = 0.0
# repetition_penalty = 1.0
