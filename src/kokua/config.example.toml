# Kokua configuration. Run `kokua config init` to write this to $KOKUA_HOME/config.toml (default
# ~/.kokua/config.toml), or point at it with --config PATH or $KOKUA_CONFIG. The file is REQUIRED
# (the [agents.*] tables exist nowhere else), every individual key is optional, and a command-line flag
# beats a value here. An unknown key or a wrong-typed value fails startup, naming the key.
#
# The assistant's update_config tool and add_mcp_server write here too, preserving comments. What
# update_config may NOT write is [security].locked_config_keys, which you own; see that key below.
# [scheduling.task.*] changes through the scheduling tools rather than update_config.
#
# Full reference: https://github.com/saxman/kokua/blob/main/docs/reference/configuration.md

[assistant]
# Default model for every agent; an agent's own `model` wins. Restart to apply.
# Unset: $AIMU_LANGUAGE_MODEL, else a running local server (never a cloud model), else startup fails.
# Append "@<base_url>" for a custom endpoint, ";<flags>" (tools,thinking,vision,audio,structured) for
# a model id AIMU does not know: "openai-compat:my-model@http://gpu-box:9000/v1;tools,thinking".
# model = "ollama:qwen3:8b"

# Default reasoning effort; an agent's own `thinking` wins. Restart to apply.
# Unset sends nothing. false = do not reason, true = the model's own effort, or "low"/"medium"/"high".
# A level is advisory on a model whose card lacks effort support (AIMU warns; reasoning stays on), and
# false also selects the card's instruct-mode sampling profile where it has one.
# thinking = "high"

# Fallback opener for any agent below that sets no `system_message` of its own.
# system_message = "You are a personal assistant running on the user's own machine. ..."

# Which [agents.<name>] table is the agent you talk to, and the root of the delegation graph.
agent = "assistant"

# Run independent tool calls in one turn concurrently, so several spawn_subagent calls overlap.
concurrent_tools = true

# Max per-conversation agents kept live in memory; an evicted one rebuilds from persisted state.
agent_cache_cap = 8

# max_iterations = 10           # model calls one turn may make; raise for search-heavy work

# Have the model write each new conversation's title from the message that opened it, on the model that
# conversation runs on. Applies immediately (no restart), and update_config may change it. false leaves
# the title as that message truncated, which is also the fallback whenever the call fails.
generate_titles = true

# Generation parameters for every agent, per-key overridable by [agents.<name>.generation]. Restart to
# apply, and keep this sub-table LAST in [assistant] (a plain key after the header would join it).
# ONLY the keys you set are sent: this tier sits above the model card's tuned profile, so each one set
# replaces the card's value for that parameter alone. A parameter the backend cannot take (min_p on
# Ollama, penalties on Anthropic) is dropped, warning only to data/logs/kokua.log. max_tokens caps
# generated tokens; context_length sizes the window they share with the prompt, and applies per request
# on Ollama only (elsewhere the window is fixed at model load or server launch).
# [assistant.generation]
# temperature = 0.7          # 0.0 to 2.0
# top_p = 0.9                # 0.0 to 1.0
# top_k = 40                 # at least 1
# min_p = 0.05               # 0.0 to 1.0
# presence_penalty = 1.5     # -2.0 to 2.0
# repetition_penalty = 1.05  # greater than 0.0
# max_tokens = 4096          # at least 1
# context_length = 32768     # at least 1

[security]
# Tools requiring confirmation before each call (terminal y/N, or Allow/Deny in the web UI). These run
# with full machine access. [] disables approval; proactive turns auto-deny these regardless. Gating is
# by tool name, so a sub-agent's call is routed to you too. A name no configured agent provides fails
# startup, naming it and suggesting the near misses: a gate matching nothing prompts for nothing, and a
# prompt that never comes is not something you notice. Only what exists at startup can be listed, so a
# tool the assistant brings in later with add_mcp_server, or one only compose_subagent would build from a
# toolset no agent names, has to be reachable from an [agents.*] table first. Locked by default.
confirm_tools = ["add_skill_script", "add_mcp_server", "execute_python", "run_command", "update_config"]

# Which config keys update_config refuses, so only a hand-edit here changes them. A pattern is
# "section.key" for one key, "section.*" for a section and every table under it, or "*" for all of
# them. Anything else fails startup (a stray space, an empty segment, a "*" outside the last one)
# rather than sitting here locking nothing. So does a pattern that is shaped right and names a
# section or key that does not exist ("agnets.*", "Agents.*", "security.confirm_tool"). An agent or
# task name inside a pattern is not checked, since you may be locking one you are about to add. This
# key is always locked, whatever the list says, so the assistant cannot unlock itself in one call;
# everything else below is yours to remove. Removing "agents.*" really does let the assistant
# rewrite any agent's tools list, and so widen its own reach, on the next restart. Restart to apply.
locked_config_keys = [
    "security.*",
    "email.to",
    "paths.data_dir",
    "agents.*",
    "scheduling.task.*",
    "compute.command_env_passthrough",
]

# Every agent, declared whole, and locked by default (see [security].locked_config_keys below). An
# agent's `tools` list IS its capability: nothing is added in code, and nothing is implicit, including
# the clock (declare "time" to get it).
#
# One namespace covers everything, so a `tools` entry may be an AIMU built-in group ("web", "fs",
# "compute", "time", "misc", "audio", "speech", "transcription"), one of Kokua's own ("memory",
# "documents", "skills", "capabilities", "config", "conversations", "mcp", "planning",
# "scheduling"), a plugin toolset ("aimu_agents", "benchmark", "github_backup", "image"), a skill by name, or an
# MCP server by its [[mcp.server]] name. `kokua --list-toolsets` lists them; an unknown name fails
# startup.
#
# `model` / `thinking` / `generation` override the [assistant] defaults for one agent and are never
# inherited by its sub-agents. A non-empty `delegates_to` gives the agent spawn_subagent(agent_type,
# task) over exactly the agents it names (acyclic; a sub-agent's gated calls still come to you), and
# `description` is the label a delegator sees.

[agents.assistant]
# The agent you talk to (see [assistant].agent above): cross-cutting tools to manage itself, plus three
# sub-agents for specialized work. Anything none of them covers, it composes a sub-agent for on
# the spot with `capabilities`, so there is no catch-all role here to route to instead.
description = "The assistant the user talks to."
system_message = "You are a personal assistant running on the user's own machine. Be concise and helpful."
tools = ["memory", "documents", "skills", "config", "mcp", "scheduling", "conversations", "planning", "capabilities", "time", "benchmark"]
delegates_to = ["researcher", "coder", "introspector"]

[agents.researcher]
description = "Research specialist: gather and verify information from the web."
# model = "ollama:qwen3:32b"   # this agent alone runs on a bigger model
# thinking = "high"            # ...and reasons harder than the rest; `false` would turn it off
# max_iterations = 25          # ...and gets more rounds, since every round spends a search
tools = ["web", "misc", "time"]
system_message = """\
You are a research sub-agent. Investigate the task with web search and page lookups, verify claims \
against sources rather than memory, and return a concise, well-organized findings summary that names \
its sources."""
# Overrides [assistant.generation] per key; what it does not name, it inherits. Keep it last in the
# agent's table, for the reason [assistant.generation] is last in [assistant].
# [agents.researcher.generation]
# temperature = 0.2
# context_length = 131072

[agents.coder]
description = "Coding specialist: read/write files and run code to complete a task."
tools = ["fs", "compute", "time"]
system_message = """\
You are a coding sub-agent. Complete the task by reading and writing files and running code (Python, \
shell, or calculations). Report exactly what you did and the concrete result."""

# Evaluates a conversation against criteria you give, in its own context rather than yours: a run's
# full reasoning and tool output would swallow the context of the conversation asking about it. It is
# the one worker that reads history, because it is the one with a conversation as its subject. Two
# grants worth knowing: `conversations` lets it read (and rename) any saved conversation, not only the
# one it was asked about, and `fs` grants read of any file on this machine, not only an export. Drop
# this agent (and its name from delegates_to above) if you would rather not have either.
[agents.introspector]
description = "Evaluates a past conversation against the criteria you specify: what was reasoned, called, delegated, and cost."
tools = ["conversations", "fs", "time"]
system_message = """\
You are an introspection sub-agent. Your subject is one of the user's own conversations and your job is \
to evaluate it against the criteria you were given.

Find the conversation with `search_conversations` or `list_conversations` if you were given a \
description rather than an id. Then call `export_conversation` on it and read the file it names with \
`read_file`. Do not evaluate from `read_conversation` alone: it returns only what was said, and the \
reasoning, the tool calls, their results, and the sub-agent activity you are being asked about are in \
the exported file and nowhere else.

Report against each criterion in turn, quoting the lines from the transcript that each judgment rests \
on, so the user can check your reading against the evidence. Three things to be strict about, because \
an evaluation that overstates its own reach is worse than a narrow one. A criterion the transcript \
cannot settle is reported as unassessable, naming what would have settled it, rather than guessed at. \
If `read_file` reports the file was truncated, say so and say which part of the run you saw: an answer \
drawn from the opening turns must never be reported as an answer about the whole run. And if you were \
given no criteria, evaluate whether the run reached what the user asked for, how much it spent doing \
so, and where it went wrong if it did, saying up front that those are the criteria you chose."""

# More agents to copy, each mixing built-in groups, MCP servers, and plugin toolsets in the one list.
# [agents.stock-trader]
# description = "Looks up quotes and places trades."
# tools = ["stocks", "compute", "time"]   # "stocks" matches [[mcp.server]].name below
# [agents.report-writer]
# description = "Builds and emails PDF reports."
# tools = ["markdown-to-pdf", "email-report", "time"]
# [agents.reviewer]
# description = "Reviews code for security, performance, and readability."
# tools = ["aimu_agents", "time"]

# Images: the assistant reads what you attach (web upload/paste, or the CLI `/attach <path>`) given a
# vision-capable model, and generates images through the `image` toolset when $AIMU_IMAGE_MODEL is set
# (without it the toolset offers no tool). The "audio", "speech", and "transcription" groups likewise
# need their own AIMU_*_MODEL var. Formats: https://saxman.info/aimu/reference/env-vars/

# Remote MCP servers to connect at startup, one [[mcp.server]] table each. `url` and `name` are
# required; `name` is how the server enters the toolset namespace, so an agent's `tools` must list it
# for the server to reach anything. `token_env` names an env var holding a bearer token (omit it when
# unauthenticated, or for OAuth, which triggers on an auth challenge). The add_mcp_server tool appends
# servers here with a host-derived name; that name reaches no agent until you add it above and restart.
# [[mcp.server]]
# url = "https://api.githubcopilot.com/mcp/"
# name = "github"
# token_env = "GITHUB_MCP_TOKEN"
#
# [[mcp.server]]
# url = "https://broker.example.com/mcp"
# name = "stocks"

# [mcp]
# Where an OAuth server sends your browser after you approve, and where Kokua listens for the code.
# Defaults to localhost on a free port picked per process, which assumes you browse from the machine
# Kokua runs on. If you do not, pin the port and forward it (ssh -L 8765:localhost:8765 kokua-host),
# or set the host to Kokua's own name if the provider accepts a non-loopback redirect. Restart to apply.
# oauth_callback_host = "localhost"
# oauth_callback_port = 8765

[paths]
# Absolute override for where all transient + user content lives. Default: $KOKUA_HOME/data.
# Locked by default. Set $KOKUA_HOME instead to move config.toml along with it.
# data_dir = "/path/to/kokua-data"

[frontend]
# Which front end `kokua` runs: "cli", "web", or any installed plugin.
name = "cli"

[web]
# Bind address for the web front end (ignored by other front ends). Kokua has no authentication of its
# own, so a routable address exposes an assistant holding your machine's tools.
host = "127.0.0.1"
port = 8000

[logging]
# Level for the rotating log at <data_dir>/logs/kokua.log (5 files x 2 MB), which records the turn
# lifecycle. One of DEBUG, INFO, WARNING, ERROR. For live state use the `/diag` chat command.
level = "INFO"

[email]
# Lets the assistant email you, through the `email-report` skill (`kokua skills install email-report`,
# then name it in an agent's `tools` beside `fs` and `compute`). It can ONLY send to `to`, which is why
# sending needs no per-call approval and scheduled turns can use it. The password comes from
# $KOKUA_EMAIL_PASSWORD, never this file; for Gmail use an App Password. Nothing is sent unless `host`,
# `to`, and that variable are all present.
# host = "smtp.gmail.com"
# port = 587                    # 587 with STARTTLS (default), or 465 with use_ssl = true
# username = "you@example.com"  # SMTP login user; defaults to `from`, then `to`
# from = "you@example.com"      # From: header; defaults to `to`
# to = "you@example.com"        # the ONLY address the assistant can send to; locked by [security].locked_config_keys by default
# use_ssl = false               # false -> STARTTLS on connect; true -> implicit TLS (SMTP_SSL)

[scheduling]
# How many conversations a scheduled task keeps (each firing runs in its own; the oldest are deleted
# after the next success). 1 replaces each run with the next; 0 keeps everything. A task can override
# this with schedule_task's `max_conversations`. Applies live. Declared by the `scheduling` toolset.
# max_task_conversations = 3

# Scheduled tasks, one table per task, the table name being the task's identity (what the sidebar shows
# and what cancel_scheduled_task takes). Written by the scheduling tools rather than update_config, so
# arming stays paired with the write. A fired one-shot stays here with enabled = false and a `fired_at`
# stamp. Task turns are proactive, so gated tools auto-deny inside them. `schedule` is one of:
#   { type = "once",     at = "2026-08-20T09:00:00" }   # an ISO-8601 local datetime
#   { type = "interval", seconds = 3600 }
#   { type = "daily",    at = "09:00" }
#   { type = "weekly",   day = "fri", at = "16:00" }     # day is mon/tue/wed/thu/fri/sat/sun
#
# [scheduling.task.morning-brief]
# prompt = "Summarize my calendar and any unread mail, and flag anything that needs a reply today."
# schedule = { type = "daily", at = "09:00" }
# enabled = true              # omit to leave it enabled; written as false when disabled or retired
# max_conversations = 3       # omit to follow [scheduling].max_task_conversations above
#
# [scheduling.task.kokua-backup]
# prompt = "Back up Kokua's state with the backup_kokua_state tool, and tell me the result in one line."
# schedule = { type = "daily", at = "03:00" }

[planning]
# Declared by the `planning` toolset: an agent's `tools` must list "planning" for "/plan <task>" to
# exist. It drafts an explicit plan (which tools/skills/MCP services to use or build) before working.
# plan_review pauses the planned turn for your Approve/Edit/Reject; off runs the plan autonomously.
# plan_review = false
# Adversarial review: plan_review_agent has an independent, context-free agent critique the plan (Kokua
# re-plans on rejection), result_review has one check the final answer before it is shown, running that
# answer non-streamed (Kokua revises on rejection), and review_rounds bounds each loop.
# plan_review_agent = false
# result_review = false
# review_rounds = 2           # the one key here needing a restart; the rest apply live
# Stream every LLM call in a planned turn (planner, reviewers, executor, each revision) under labeled
# phase headers. Overrides result_review's hide-until-vetted gate.
# show_reasoning = false

[capabilities]
# Declared by the `capabilities` toolset: an agent's `tools` must list "capabilities" to get
# list_capabilities (what else is installed) and compose_subagent (build a sub-agent holding exactly
# what one task needs, and run it). A composed sub-agent runs on the [assistant] defaults and still
# obeys [security].confirm_tools; composing itself is ungated unless you add compose_subagent there.
# max_depth bounds nesting: at 3 the last sub-agent in a chain holds neither tool, 0 switches composing
# off. Applies live, to the next composition.
# max_depth = 3

[github_backup]
# Back up Kokua's own state (config.toml, memory, documents, skills, conversation transcripts) to a
# private GitHub repository as a git commit, when you ask or when a scheduled task fires. Declared by
# the `github_backup` toolset: an agent's `tools` must list "github_backup" for backup_kokua_state to
# exist, and this key must be set or the toolset offers no tool at all. The repository MUST be private;
# Kokua checks and refuses otherwise. The token comes from $GITHUB_BACKUP_TOKEN (a fine-grained PAT
# with `contents: write`, scoped to this repository alone), never this file. Restart to apply.
# repo = "you/kokua-backup"
# branch = "main"

[compute]
# Declared by the `compute` toolset: an agent's `tools` must list "compute" to get calculate,
# execute_python, and run_command. Both execution tools run as this process's user, so both are in
# [security].confirm_tools above; neither offers containment, and run_command offers one step less of
# it, since a shell string reaches a credential in a file with no code to read first. run_command also
# carries no memory cap, unlike execute_python's 512 MB limit: that cap would break compilers and test
# suites, and a shell child's own cap would need preexec_fn, which is neither portable nor thread-safe.
# A command's child sees a small environment allowlist with no API keys in it, which is what stops
# `run_command("env")` handing the model your credentials, and which also makes gh, ssh, and git push
# over ssh fail. Name the variables you want admitted, comma separated, to grant one of those back. A
# list would be the natural shape and is not available: a toolset setting is a string, an int, or a
# bool. Restart to apply.
# command_env_passthrough = "SSH_AUTH_SOCK, GH_TOKEN"
