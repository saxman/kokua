# thinking = "high"
# model = "ollama:qwen3:32b"
# system_message = "..."

# Remote MCP servers. An agent reaches one only by naming it in `available` (or declaring "all").
# token_env names an env var holding a bearer token; omit it for an open or OAuth server.
# [[mcp.server]]
# url = "https://api.githubcopilot.com/mcp/"
# name = "github"
# token_env = "GITHUB_MCP_TOKEN"
#
# [[mcp.server]]
# url = "https://broker.example.com/mcp"
# name = "stocks"
# description = "Stock quotes and fundamentals, and placing trades."

# [mcp]
# oauth_callback_host = "localhost"
# oauth_callback_port = 8765   # pin it, and forward it, when your browser is not on Kokua's machine

[paths]
# data_dir = "/path/to/kokua-data"   # default $KOKUA_HOME/data

[frontend]
name = "cli"                   # "cli", "web", or an installed plugin

[web]
host = "127.0.0.1"             # Kokua has no authentication, so keep this off routable addresses
port = 8000

[logging]
level = "INFO"                 # DEBUG, INFO, WARNING, or ERROR, for <data_dir>/logs/kokua.log

# Lets the email-report skill mail you, and only `to`. The password comes from $KOKUA_EMAIL_PASSWORD.
[email]
# host = "smtp.gmail.com"
# port = 587                   # 587 for STARTTLS, or 465 with use_ssl = true
# username = "you@example.com" # default: from, then to
# from = "you@example.com"     # default: to
# to = "you@example.com"
# use_ssl = false

[scheduling]
# max_task_conversations = 3   # conversations each task keeps; 0 keeps all; applies live

# Scheduled tasks, written by the scheduling tools or by hand. `schedule` is one of:
#   { type = "once",     at = "2026-08-20T09:00:00" }
#   { type = "interval", seconds = 3600 }
#   { type = "daily",    at = "09:00" }
#   { type = "weekly",   day = "fri", at = "16:00" }
# [scheduling.task.morning-brief]
# prompt = "Summarize my calendar and any unread mail, and flag anything that needs a reply today."
# schedule = { type = "daily", at = "09:00" }
# enabled = true
# max_conversations = 3

[planning]
# plan_review = false          # pause a /plan turn for your approval; applies live
# plan_review_agent = false    # an independent agent critiques the plan; applies live
# result_review = false        # an independent agent checks the final answer; applies live
# review_rounds = 2            # bounds each replan or revise loop
# show_reasoning = false       # stream every call in a planned turn; applies live

[capabilities]
# max_depth = 3                # how far compose_subagent may nest; 0 turns it off; applies live

[github_backup]
# repo = "you/kokua-backup"    # must be private; the token comes from $GITHUB_BACKUP_TOKEN
# branch = "main"

